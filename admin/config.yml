backend:
  name: turbo-github
  turbo_site_id: 47485749-208a-4a37-9561-090159282c92

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: posts
    label: Blogposts
    folder: "_posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "post"

      - label: "Titel"
        name: "title"
        widget: "string"

      - label: "Datum"
        name: "date"
        widget: "datetime"

      - label: "Kategorie"
        name: "category"
        widget: "select"
        options:
          - "Schreiben"
          - "Bücher"
          - "Kinderbuch"
          - "Podcast"
          - "Persönliches"
          - "Neuigkeiten"
        default: "Neuigkeiten"

      - label: "Kurzbeschreibung"
        name: "excerpt_text"
        widget: "text"
        hint: "Ein bis zwei Sätze für die Blogübersicht."

      - label: "Titelbild"
        name: "image"
        widget: "image"
        required: false

      - label: "Bildbeschreibung"
        name: "image_alt"
        widget: "string"
        required: false

      - label: "Bildunterschrift"
        name: "image_caption"
        widget: "string"
        required: false

      - label: "Text"
        name: "body"
        widget: "markdown"
