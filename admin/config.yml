backend:
  name: turbo-github
  turbo_site_id: 47485749-208a-4a37-9561-090159282c92
  repo: OberhuemerBooks/oberhuemerbooks.github.io
  branch: main
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
  - name: posts
    label: Blogposts
    folder: posts
    create: true
    slug: '{{slug}}'
    fields:
            - {label: Titel, name: title, widget: string}
            - {label: Datum, name: date, widget: datetime}
            - {label: Text, name: body, widget: markdown}
